name: poptart_xrpc
resolution: workspace
description: Core library for XRPC communication. This is a wrapped HTTP client for AT Protocol.
version: 0.1.0
homepage: https://github.com/sprksocial/poptart
documentation: https://atprotodart.com/docs/intro
repository: https://github.com/sprksocial/poptart
issue_tracker: https://github.com/sprksocial/poptart/issues
funding:
  - https://github.com/sponsors/myConsciousness

environment:
  sdk: ">=3.8.0 <4.0.0"

topics:
  - atproto
  - bluesky
  - http
  - xrpc

dependencies:
  http: ^1.4.0
  poptart_primitives: ^0.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  mime: ^2.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  freezed: ^3.2.0
  import_sorter:
    git:
      url: https://github.com/myConsciousness/import_sorter.git
      ref: fix/monorepo-pub-workspaces
