name: poptart_lex_gen
description: Code generator for building Dart models and runtime descriptors from AT Protocol lexicons.
version: 0.3.0
resolution: workspace
homepage: https://poptart.xyz
documentation: https://poptart.xyz
repository: https://github.com/sprksocial/poptart
issue_tracker: https://github.com/sprksocial/poptart/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  poptart_lexicon: ^0.1.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  import_sorter:
    git:
      url: https://github.com/myConsciousness/import_sorter.git
      ref: fix/monorepo-pub-workspaces
